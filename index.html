<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="login-wrapper">
    <div class="login-card">
      <h1 class="login-title">Password Manager</h1>
      <div class="demo-login-bar">
        <span>Demo: admin / admin123</span>
        <button type="button" id="autofill-btn">Autofill</button>
      </div>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button type="submit" id="login-submit-btn">Sign In</button>
      </form>
    </div>
  </div>
  <div class="app-container">
    <header class="app-header">
      <h1>Password Manager</h1>
    </header>
    <main id="app-main">
    <div class="metrics-row">
      <div class="metric-card" id="metric-total">Total: 0</div>
      <div class="metric-card" id="metric-strong">Strong: 0</div>
      <div class="metric-card" id="metric-weak">Weak: 0</div>
    </div>
    <section class="card form-card">
      <h2>Add New Credential</h2>
      <form id="credential-form">
        <div class="form-group">
          <label for="website-input">Website</label>
          <div class="site-input-box">
            <span id="site-favicon-preview"></span>
            <input type="text" id="website-input" placeholder="e.g. github.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="username-input">Username</label>
          <input type="text" id="username-input" placeholder="e.g. user@example.com" required>
        </div>
        <div class="form-group">
          <label for="password-input">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password-input" placeholder="Enter password" required>
            <button type="button" id="toggle-pw-visibility">Show</button>
          </div>
        </div>
        <button type="submit" id="save-btn">Save Credential</button>
      </form>
    </section>
    <section class="card generator-card">
      <h2>Password Generator</h2>
      <div class="slider-row">
        <label for="length-slider">Length: <span id="length-val">16</span></label>
        <div class="preset-buttons">
          <button type="button" class="preset-btn" data-length="12">12</button>
          <button type="button" class="preset-btn" data-length="16">16</button>
          <button type="button" class="preset-btn" data-length="20">20</button>
          <button type="button" class="preset-btn" data-length="24">24</button>
        </div>
        <input type="range" id="length-slider" min="6" max="64" value="16">
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="gen-upper" checked> Uppercase</label>
        <label><input type="checkbox" id="gen-lower" checked> Lowercase</label>
        <label><input type="checkbox" id="gen-nums" checked> Numbers</label>
        <label><input type="checkbox" id="gen-syms" checked> Symbols</label>
      </div>
      <button type="button" id="generate-btn">Generate Password</button>
    </section>
    <section class="card list-card">
      <div class="filter-tabs">
          <button type="button" class="filter-pill active" data-filter="all">All</button>
          <button type="button" class="filter-pill" data-filter="strong">Strong</button>
          <button type="button" class="filter-pill" data-filter="weak">Needs Review</button>
        </div>
        <h2>Saved Credentials</h2>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search logins...">
      </div>
      <div id="credential-list" class="credential-list"></div>
    </section>
  </main>
  </div>
</body>
</html>
